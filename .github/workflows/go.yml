name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        cgo: ["1"]
        include:
          - os: macos-15
            cgo: "0"
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race checks
        if: matrix.cgo == '1'
        run: go test -race ./...
      - name: Build native macOS frontend
        if: runner.os == 'macOS' && matrix.cgo == '1'
        run: |
          version="dev+${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          GOARCH=arm64 go build -trimpath -ldflags "-X main.version=$version" -o dist/cbzr-native .
          test "$(dist/cbzr-native -version)" = "cbzr $version"
          clang -fobjc-arc -framework Cocoa internal/native/testdata/input.m -o "$RUNNER_TEMP/native-input-test"
          "$RUNNER_TEMP/native-input-test"
      - name: Upload native macOS ARM64 binary
        if: runner.os == 'macOS' && matrix.cgo == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbzr-darwin-arm64
          path: dist/cbzr-native
          if-no-files-found: error
          retention-days: 7
      - name: Build portable macOS and Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="dev+${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          for target in darwin/amd64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/cbzr-$goos-$arch" .
          done
          test "$(dist/cbzr-linux-amd64 -version)" = "cbzr $version"
      - name: Upload portable binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbzr-portable
          path: dist/cbzr-*
          if-no-files-found: error
          retention-days: 7
      - name: Compile declared BSD targets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in freebsd netbsd openbsd dragonfly; do
            CGO_ENABLED=0 GOOS="$target" GOARCH=amd64 go build ./...
          done
